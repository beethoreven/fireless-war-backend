name: Keep Render backend awake

on:
  schedule:
    # 每 10 分鐘打一次,留一點緩衝在 Render 免費方案「閒置 15 分鐘休眠」的門檻之前
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /status
        run: curl -sf https://fireless-war-backend.onrender.com/status
